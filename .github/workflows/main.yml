
name: Update Surge Rules

on:
  schedule:
    - cron: '17 2 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      SOURCE_URL: https://www.macat.vip/list.txt
      OUTPUT_FILE: rules.list
      REMOVE_TEXT: '0.0.0.0'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download and Clean Rules
        run: python scripts/clean_list.py

      - name: Commit Updated Rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules.list

          if ! git diff --cached --quiet; then
            git commit -m "Update Surge rules"
            git push
          else
            echo "Rules unchanged, skip commit."
          fi
