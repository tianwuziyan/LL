
name: Update Cleaned List

on:
  schedule:
    - cron: '17 2 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      SOURCE_URL: https://www.macat.vip/list.txt
      REMOVE_TEXT: '0.0.0.0'
      OUTPUT_FILE: cleaned.list

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Rules
        run: python scripts/clean_list.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cleaned.list

          if ! git diff --cached --quiet; then
            git commit -m "Update cleaned list"
            git push
          else
            echo "No changes detected"
          fi
