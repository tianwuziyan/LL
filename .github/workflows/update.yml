
name: Update Adobe Surge List

on:
  schedule:
    - cron: '17 2 * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-adobe-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download and Update Lists
        run: |
          python - <<'PY'
          import re
          import sys
          import ipaddress
          import urllib.request
          from pathlib import Path

          SOURCES = [
              {
                  "name": "macat Hosts",
                  "url": "https://www.macat.vip/list.txt",
                  "output": Path("adobe.list"),
                  "mode": "hosts",
              },
              {
                  "name": "Kelee Adobe",
                  "url": "https://rule.kelee.one/Clash/Adobe.yaml",
                  "output": Path("adobe-kelee.list"),
                  "mode": "surge",
              },
              {
                  "name": "Kelee AdobeActivation",
                  "url": "https://rule.kelee.one/Clash/AdobeActivation.yaml",
                  "output": Path("adobe-activation.list"),
                  "mode": "surge",
              },
          ]

          MINIMUM_RETAIN_RATIO = 0.5

          DOMAIN_PATTERN = re.compile(
              r"^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?"
              r"(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$"
          )

          RULE_PATTERN = re.compile(
              r"^[A-Z][A-Z0-9-]*,"
          )

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()

              if not data:
                  raise RuntimeError("下载内容为空")

              if data.lstrip().lower().startswith(
                  (b"<!doctype html", b"<html")
              ):
                  raise RuntimeError("源地址返回 HTML")

              for encoding in ("utf-8-sig", "gb18030"):
                  try:
                      return data.decode(encoding)
                  except UnicodeDecodeError:
                      continue

              raise RuntimeError("无法识别文件编码")

          def valid_domain(domain):
              domain = domain.lower().rstrip(".")

              if not domain or len(domain) > 253:
                  return False

              try:
                  ipaddress.ip_address(domain)
                  return False
              except ValueError:
                  pass

              if not DOMAIN_PATTERN.fullmatch(domain):
                  return False

              return all(
                  len(label) <= 63
                  for label in domain.split(".")
              )

          def convert_hosts(text):
              domains = set()
              header_lines = []
              in_header = True

              for raw_line in text.splitlines():
                  line = raw_line.strip()

                  if in_header:
                      if not line or line.startswith("#"):
                          header_lines.append(raw_line)
                          continue
                      in_header = False

                  if not line or line.startswith("#"):
                      continue

                  line = line.split("#", 1)[0].strip()
                  parts = line.split()

                  if len(parts) < 2:
                      continue

                  try:
                      ip = str(ipaddress.ip_address(parts[0]))
                  except ValueError:
                      continue

                  if ip != "0.0.0.0":
                      continue

                  for domain in parts[1:]:
                      domain = domain.lower().rstrip(".")

                      if valid_domain(domain):
                          domains.add(domain)

              if not domains:
                  raise RuntimeError("没有提取到有效域名")

              rules = "\n".join(
                  f"DOMAIN,{domain}"
                  for domain in sorted(domains)
              )

              header = "\n".join(header_lines).strip()

              if header:
                  return header + "\n\n" + rules + "\n"

              return rules + "\n"

          def validate_surge(text):
              lines = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]

              rules = [
                  line for line in lines
                  if RULE_PATTERN.match(line)
              ]

              if not rules:
                  raise RuntimeError("没有发现有效 Surge 规则")

              if len(rules) != len(lines):
                  raise RuntimeError("发现无法识别的规则行，拒绝覆盖旧文件")

              return len(rules)

          def update_source(source):
              output = source["output"]

              print(f"\n开始处理：{source['name']}")

              text = fetch(source["url"])

              if source["mode"] == "hosts":
                  result = convert_hosts(text)
                  new_count = sum(
                      1 for line in result.splitlines()
                      if line.startswith("DOMAIN,")
                  )
              else:
                  new_count = validate_surge(text)
                  result = text

              if not result.strip():
                  raise RuntimeError("生成内容为空")

              if output.exists():
                  old_text = output.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )

                  if source["mode"] == "hosts":
                      old_count = sum(
                          1 for line in old_text.splitlines()
                          if line.startswith("DOMAIN,")
                      )
                  else:
                      old_count = sum(
                          1 for line in old_text.splitlines()
                          if RULE_PATTERN.match(line.strip())
                      )

                  if old_count > 0:
                      minimum = int(old_count * MINIMUM_RETAIN_RATIO)

                      if new_count < minimum:
                          raise RuntimeError(
                              f"规则数量异常减少："
                              f"旧版 {old_count} 条，新版 {new_count} 条，"
                              f"低于保护阈值 {minimum} 条"
                          )

              temp_file = output.with_suffix(".tmp")
              temp_file.write_text(result, encoding="utf-8")
              temp_file.replace(output)

              print(f"更新成功：{output}")
              print(f"规则数量：{new_count}")

          success_count = 0
          failure_count = 0

          for source in SOURCES:
              try:
                  update_source(source)
                  success_count += 1
              except Exception as error:
                  failure_count += 1
                  print(
                      f"\n处理失败：{source['name']}：{error}",
                      file=sys.stderr
                  )

          print("\n========== 更新结果 ==========")
          print(f"成功：{success_count}")
          print(f"失败：{failure_count}")

          if success_count == 0:
              print("所有来源均更新失败", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Validate Output
        run: |
          for file in adobe.list adobe-kelee.list adobe-activation.list; do
            if [ -f "$file" ]; then
              echo "检查：$file"
              test -s "$file"
            fi
          done

      - name: Keep Repository Alive
        run: |
          mkdir -p .github
          date -u +"Last successful update: %Y-%m-%d %H:%M UTC" \
            > .github/heartbeat.txt

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add adobe.list adobe-kelee.list adobe-activation.list \
            .github/heartbeat.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update Adobe Surge lists"
            git push
          else
            echo "没有变化"
          fi
